<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha Python</title>
<style>
:root{--bg:#e9f1ee;--card:#fff;--ink:#14302b;--mute:#5b756f;--line:#c9dad5;--acc:#f2c230;--accInk:#3a2e00;--ok:#1f8a5b;--bad:#c2410c;--code:#0f2a35;--codeInk:#e8f6f1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1f24;--card:#16303a;--ink:#e6f2ee;--mute:#93b0a9;--line:#2a4852;--code:#08161a;--ok:#4cc38a;--bad:#ff9a62;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.5}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.trail{list-style:none;margin:18px 0 0;padding:0 0 0 22px;border-left:4px dotted var(--line)}
.trail li{margin:0 0 12px;position:relative}
.trail li::before{content:"";position:absolute;left:-33px;top:16px;width:18px;height:18px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.trail li.done::before{background:var(--ok)}
.lesson{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;color:inherit;cursor:pointer}
.lesson b{display:block;font-size:16px}.lesson span{color:var(--mute);font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
pre,.out{background:var(--code);color:var(--codeInk);border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:10px 0;white-space:pre}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--line);padding:1px 5px;border-radius:5px}
textarea{width:100%;min-height:120px;background:var(--code);color:var(--codeInk);border:2px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:4}
textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font:15px ui-monospace,Menlo,Consolas,monospace;color:inherit;cursor:pointer}
.opt.sel{border-color:var(--acc);background:var(--card)}
.btn{display:block;width:100%;margin-top:12px;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:14px;font:700 16px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.btn[disabled]{opacity:.6}
.btn.ghost{background:transparent;color:var(--mute);font-weight:400;font-size:14px;padding:8px;border:2px solid var(--line)}
