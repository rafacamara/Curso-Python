<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha Python</title>
<style>
:root{--bg:#e9f1ee;--card:#fff;--ink:#14302b;--mute:#5b756f;--line:#c9dad5;--acc:#f2c230;--accInk:#3a2e00;--ok:#1f8a5b;--bad:#c2410c;--code:#0f2a35;--codeInk:#e8f6f1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1f24;--card:#16303a;--ink:#e6f2ee;--mute:#93b0a9;--line:#2a4852;--code:#08161a;--ok:#4cc38a;--bad:#ff9a62;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.5}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.trail{list-style:none;margin:18px 0 0;padding:0 0 0 22px;border-left:4px dotted var(--line)}
.trail li{margin:0 0 12px;position:relative}
.trail li::before{content:"";position:absolute;left:-33px;top:16px;width:18px;height:18px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.trail li.done::before{background:var(--ok)}
.lesson{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;color:inherit;cursor:pointer}
.lesson b{display:block;font-size:16px}.lesson span{color:var(--mute);font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
pre,.out{background:var(--code);color:var(--codeInk);border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:10px 0;white-space:pre}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--line);padding:1px 5px;border-radius:5px}
textarea{width:100%;min-height:120px;background:var(--code);color:var(--codeInk);border:2px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:4}
textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font:15px ui-monospace,Menlo,Consolas,monospace;color:inherit;cursor:pointer}
.opt.sel{border-color:var(--acc);background:var(--card)}
.btn{display:block;width:100%;margin-top:12px;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:14px;font:700 16px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}
.btn[disabled]{opacity:.6}
.btn.ghost{background:transparent;color:var(--mute);font-weight:400;font-size:14px;padding:8px;border:2px solid var(--line)}
.fb{margin-top:10px;font-weight:700;white-space:pre-wrap}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.back{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:4px 0;margin-bottom:8px}
.big{text-align:center;padding:24px 8px}.big h2{font-size:28px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script src="lessons.js"></script>
<script>
var S={xp:0,done:{},last:"",streak:0},A=document.getElementById("app"),cur=null,W,ready=false,waitReady=null,pending=null;
function load(){try{var s=localStorage.getItem("trilhaPy2");if(s)S=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem("trilhaPy2",JSON.stringify(S))}catch(e){}}
function ds(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function tick(){var t=ds(new Date());if(S.last===t)return;var y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===ds(y)?S.streak+1:1;S.last=t}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function badge(){var b=document.getElementById("py");if(b)b.textContent=ready?"🐍 pronto":"🐍 carregando…"}
function boot(){ready=false;W=new Worker("worker.js");
 W.onmessage=function(m){var d=m.data;if(d.ready){ready=true;badge();if(waitReady){var f=waitReady;waitReady=null;f()}}else if(pending){var p=pending;pending=null;p(d)}};
 W.onerror=function(){if(pending){var p=pending;pending=null;p({ok:false,out:"",err:"Não foi possível iniciar o Python."})}}}
function run(code,inp){return new Promise(function(res){var t;
 var go=function(){pending=function(r){clearTimeout(t);res(r)};W.postMessage({code:code,input:inp||""});
  t=setTimeout(function(){pending=null;W.terminate();boot();res({ok:false,out:"",err:"Tempo esgotado. Há um loop infinito?"})},8000)};
 if(ready)go();else waitReady=go})}
function home(){cur=null;var n=Object.keys(S.done).length,lv=Math.floor(S.xp/100)+1,pc=S.xp%100;
 var h='<div class="top"><h1>Trilha Python</h1><div class="stats"><span class="chip" id="py"></span><span class="chip">🔥 '+S.streak+'</span><span class="chip">'+S.xp+' XP</span></div></div>';
 h+='<div class="bar"><i style="width:'+pc+'%"></i></div><p style="color:var(--mute);margin:6px 0 0;font-size:14px">Nível '+lv+' · '+n+' de '+P.length+' fases concluídas</p><ul class="trail">';
 P.forEach(function(l,i){h+='<li class="'+(S.done[i]?"done":"")+'"><button class="lesson" onclick="start('+i+')"><b>Fase '+(i+1)+': '+l.t+'</b><span>Capítulo '+l.c+' · '+l.ch.length+' desafios</span></button></li>'});
 h+='</ul><button class="btn ghost" onclick="reset()">Zerar progresso</button>';A.innerHTML=h;badge()}
function reset(){if(confirm("Apagar todo o progresso?")){S={xp:0,done:{},last:"",streak:0};save();home()}}
function steps(l){var tp=l.tp||[{t:l.t,th:l.th,ch:l.ch}],s=[];tp.forEach(function(t){s.push({th:t.th,t:t.t});t.ch.forEach(function(c){s.push(c)})});return s}
function start(i){cur={i:i,k:-1,sel:-1,tries:0,gain:0,st:steps(P[i])};next()}
function next(){cur.k++;cur.sel=-1;cur.tries=0;if(cur.k>=cur.st.length)return finish();var c=cur.st[cur.k];
 var h='<button class="back" onclick="home()">← '+(c.th?"Trilha":"Sair")+'</button><div class="bar"><i style="width:'+(cur.k/cur.st.length*100)+'%"></i></div>';
 if(c.th){A.innerHTML=h+'<h2 style="margin-top:12px">'+esc(c.t)+'</h2><div class="card">'+c.th+'</div><button class="btn" onclick="next()">'+(cur.k+1<cur.st.length?"Continuar":"Concluir")+'</button>';return}
 h+='<div class="card"><p style="margin:0;white-space:pre-wrap"><b>'+esc(c.q)+'</b></p>';
 if(c.o)c.o.forEach(function(o,k){h+='<button class="opt" onclick="pick('+k+')">'+esc(o)+'</button>'});
 else h+='<div class="out">'+(c.tests?'Exemplo\nEntrada:\n'+esc(c.tests[0][0])+'\nSaída:\n'+esc(c.tests[0][1]):'Saída esperada:\n'+esc(c.out))+'</div><textarea id="code" spellcheck="false" autocapitalize="none" autocorrect="off" aria-label="Seu código">'+esc(c.s)+'</textarea><div id="res"></div>';
 h+='<div id="fb" class="fb" role="status"></div>'+(c.o?'':'<button class="btn ghost" id="ex" onclick="exec()">Executar</button>')+'<button class="btn" id="go" onclick="check()">Verificar</button></div>';A.innerHTML=h}
function pick(k){cur.sel=k;document.querySelectorAll(".opt").forEach(function(b,j){b.className="opt"+(j==k?" sel":"")})}
function busy(on){["go","ex"].forEach(function(id){var b=document.getElementById(id);if(b)b.disabled=on});if(on)document.getElementById("fb").textContent=ready?"Executando…":"Carregando o Python (só na primeira vez)…"}
function exec(){var c=cur.st[cur.k];busy(true);run(document.getElementById("code").value+c.add,c.tests?c.tests[0][0]:"").then(function(r){busy(false);var f=document.getElementById("fb");f.className="fb";f.textContent="";document.getElementById("res").innerHTML='<div class="out">'+esc((r.out||"(sem saída)")+(r.ok?"":"\n"+r.err))+'</div>'})}
function win(){var fb=document.getElementById("fb"),g=cur.tries==0?10:5;S.xp+=g;cur.gain+=g;tick();save();fb.className="fb ok";fb.textContent="Correto! +"+g+" XP";var b=document.getElementById("go");b.disabled=false;b.textContent="Continuar";b.onclick=next}
function check(){var c=cur.st[cur.k],fb=document.getElementById("fb");
 if(c.o){if(cur.sel<0){fb.className="fb bad";fb.textContent="Escolha uma opção.";return}if(cur.sel===c.a)return win();cur.tries++;fb.className="fb bad";fb.textContent="Ainda não. Tente de novo.";return}
 var code=document.getElementById("code").value+c.add,T=c.tests||[["",c.out]];busy(true);
 (function step(i){run(code,T[i][0]).then(function(r){
  if(r.ok&&r.out.trimEnd()===T[i][1].trimEnd()){if(i+1<T.length)return step(i+1);document.getElementById("go").disabled=false;document.getElementById("ex").disabled=false;return win()}
  document.getElementById("go").disabled=false;document.getElementById("ex").disabled=false;cur.tries++;fb.className="fb bad";
  var m="Ainda não"+(c.tests?" (teste "+(i+1)+" de "+T.length+")":"")+".\n"+(c.tests?"Entrada:\n"+T[i][0]+"\nEsperado:\n"+T[i][1]+"\n":"")+"Saída obtida:\n"+(r.out||"(vazia)")+(r.ok?"":"\nErro: "+r.err);
  if(cur.tries>1)m+="\n\nExemplo de solução:\n"+c.h;fb.textContent=m})})(0)}
function finish(){var first=!S.done[cur.i];if(first){S.done[cur.i]=1;S.xp+=20;cur.gain+=20;tick();save()}
 A.innerHTML='<div class="card big"><h2>Fase concluída</h2><p>'+(first?"Você ganhou +"+cur.gain+" XP nesta fase.":"Treino feito. +"+cur.gain+" XP.")+'</p><button class="btn" onclick="home()">Voltar à trilha</button></div>'}
load();boot();home();
</script>
</body>
</html>
